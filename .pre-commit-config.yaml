# The lint standard of the repository: see skills/smarter-code-quality.
# Install the commit-msg hook too, so that commitlint checks each commit message.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words=codespell.txt"]
        exclude: '\.svg$|package-lock\.json$'
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types: [text]
      - id: eslint
        name: eslint
        entry: npx eslint --max-warnings=0 --no-warn-ignored
        language: system
        types_or: [javascript]
      - id: template-tests
        name: template tests and sandbox lint
        entry: npx vitest run
        language: system
        files: ^(template\.tpl|metadata\.yaml|test/)
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: trailing-whitespace
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional", "@commitlint/config-angular"]
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
  skip: [prettier, eslint, template-tests, commitlint]
