---
#------------------------------------------------------------------------------
# Lint, and run template.tpl's scenarios and the sandbox lint, in Node, with
# coverage of the template's code, which goes to Codecov.
# GTM itself is not in CI: see doc/adr/007-testing.md.
#
# Requires a CODECOV_TOKEN secret.
#------------------------------------------------------------------------------
name: Test

on:
  workflow_dispatch:
  push:
    branches: [main, alpha, beta]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Tests, with coverage
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
