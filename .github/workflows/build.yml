---
#------------------------------------------------------------------------------
# Build the Gallery's package: the files that GTM's Community Template Gallery
# reads from the repository's root (template.tpl, metadata.yaml and LICENSE),
# checked the way a Gallery release needs them (test/template.test.mjs: GTM's
# sections in GTM's order, the field names that containers store values by,
# metadata.yaml and the Apache 2.0 license), and keep them as an artifact, for
# import into a test container (doc/adr/007-testing.md, 008-gallery.md).
#
# The scenarios, the sandbox lint and the lint are test.yml's. This workflow
# publishes nothing: see pushMain.yml.
#------------------------------------------------------------------------------
name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, alpha, beta]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check the Gallery's files
        run: npx vitest run test/template.test.mjs

      - name: Upload the Gallery's files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smarter-gtm-template-${{ github.sha }}
          path: |
            template.tpl
            metadata.yaml
            LICENSE
          if-no-files-found: error
          retention-days: 14
